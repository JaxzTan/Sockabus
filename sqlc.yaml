# sqlc config (docs/TRD.md §8 repo layout). Regenerate with `make sqlc`; CI fails if generated code is stale.
version: "2"
sql:
  - engine: postgresql
    schema: db/migrations # golang-migrate files; sqlc ignores *.down.sql
    queries: db/queries
    gen:
      go:
        package: db
        out: internal/db
        sql_package: pgx/v5
        emit_json_tags: true
        emit_enum_valid_method: true
        emit_all_enum_values: true
        emit_empty_slices: true
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: jsonb
            go_type: encoding/json.RawMessage
          - db_type: jsonb
            nullable: true
            go_type: encoding/json.RawMessage
          # Ciphertext, blind-index and key-ref columns (000011, 000012) never leave the API: the service
          # decrypts into the plaintext fields, so JSON responses keep their old shape.
          - column: conversations.scammer_handle_ciphertext
            go_struct_tag: json:"-"
          - column: conversations.scammer_peer_ref_ciphertext
            go_struct_tag: json:"-"
          - column: conversations.scammer_peer_ref_bidx
            go_struct_tag: json:"-"
          - column: conversations.identifiers_dek_ref
            go_struct_tag: json:"-"
          - column: personas.demo_identifiers_ciphertext
            go_struct_tag: json:"-"
          - column: personas.demo_identifiers_dek_ref
            go_struct_tag: json:"-"
          - column: conversation_summaries.summary_ciphertext
            go_struct_tag: json:"-"
          - column: conversation_summaries.dek_ref
            go_struct_tag: json:"-"
          - column: persona_summaries.summary_ciphertext
            go_struct_tag: json:"-"
          - column: persona_summaries.dek_ref
            go_struct_tag: json:"-"
          - column: overview_summaries.summary_ciphertext
            go_struct_tag: json:"-"
          - column: overview_summaries.dek_ref
            go_struct_tag: json:"-"
