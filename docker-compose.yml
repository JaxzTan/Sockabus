# Local environment (docs/TRD.md §8): Redis, Temporal dev server, Sockabus app + dashboard.
# The app's database is Supabase: SOCKABUS_POSTGRES_URL from .env (session pooler, port 5432, sslmode=require).
# `make up` starts Redis + Temporal only; `docker compose --profile app up` also runs the Go app and the web dashboard.
services:
  redis:
    container_name: redis
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  temporal:
    container_name: temporal
    image: temporalio/temporal:1.5.1
    # In-memory dev server: workflow history resets on restart.
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports:
      - "7233:7233" # gRPC
      - "8233:8233" # Web UI

  app:
    container_name: app
    profiles: [app]
    build: .
    env_file: .env
    environment:
      SOCKABUS_REDIS_ADDR: redis:6379
      SOCKABUS_TEMPORAL_HOSTPORT: temporal:7233
      SOCKABUS_TG_SESSION_DIR: /secrets/telegram
    # Session files from make tglogin (same mount as docker-compose.prod.yml).
    volumes: [./.secrets/telegram:/secrets/telegram]
    ports: ["8080:8080"]
    # No postgres dependency: the app connects to Supabase via SOCKABUS_POSTGRES_URL in .env.
    depends_on:
      redis: { condition: service_healthy }
      temporal: { condition: service_started }

  web:
    container_name: web
    profiles: [app]
    build:
      context: ./web
      args:
        SOCKABUS_API_URL: http://app:8080 # browser calls /api/*, Next proxies to the app container
    environment:
      SOCKABUS_OPERATOR_TOKEN: ${SOCKABUS_OPERATOR_TOKEN:-} # added by the /api proxy, never sent to the browser
      # Console sign-in with Google, done on the Next server (web/src/lib/auth.ts, web/src/lib/google.ts)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      SOCKABUS_SESSION_SECRET: ${SOCKABUS_SESSION_SECRET:-}
      SOCKABUS_CONSOLE_GOOGLE_ALLOWED_EMAILS: ${SOCKABUS_CONSOLE_GOOGLE_ALLOWED_EMAILS:-}
      SOCKABUS_CONSOLE_GOOGLE_ALLOWED_DOMAIN: ${SOCKABUS_CONSOLE_GOOGLE_ALLOWED_DOMAIN:-}
      SOCKABUS_CONSOLE_AUTH: ${SOCKABUS_CONSOLE_AUTH:-}
      # /automate reads Playwright results from disk (web/src/lib/e2e-results.ts); the report and
      # screenshots are found one level up from it (/e2e/playwright-report, /e2e/test-results).
      SOCKABUS_E2E_RESULTS_DIR: /e2e/results
    volumes:
      - ./playwright/results:/e2e/results:ro
      - ./playwright/playwright-report:/e2e/playwright-report:ro
      - ./playwright/test-results:/e2e/test-results:ro
    ports: ["3000:3000"]
    depends_on: [app]
