name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - run: docker build -t sockabus:ci .

  db: # TRD §8: sqlc diff + vet, migrations up/down, integration tests on real PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: buru
          POSTGRES_USER: buru
          POSTGRES_PASSWORD: buru
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U buru -d buru"
          --health-interval 5s
          --health-retries 20
    env:
      DB_URL: postgres://buru:buru@localhost:5432/buru?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.31.1"
      - run: sqlc diff
      - run: sqlc vet
      - run: go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1
      - run: migrate -path db/migrations -database "$DB_URL" up
      - run: migrate -path db/migrations -database "$DB_URL" down -all
      - run: migrate -path db/migrations -database "$DB_URL" up
      - run: go test -count=1 ./internal/db/
        env:
          SOCKABUS_TEST_POSTGRES_URL: ${{ env.DB_URL }}

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  e2e: # TRD §9 / TR-21: Playwright API + UI tests against the Compose stack with the fake LLM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOCKABUS_API_URL: http://localhost:8080
      SOCKABUS_WEB_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      # Throwaway values only: fake LLM, local PostgreSQL in Compose, fresh keys per run.
      - name: Write CI .env
        run: |
          token=$(openssl rand -hex 24)
          session_secret=$(openssl rand -hex 32)
          echo "::add-mask::$token"
          echo "::add-mask::$session_secret"
          cat > .env <<EOF
          SOCKABUS_ENV=ci
          SOCKABUS_MODE=live
          SOCKABUS_POSTGRES_URL=postgres://buru:buru@postgres:5432/buru?sslmode=disable
          SOCKABUS_OPERATOR_TOKEN=$token
          SOCKABUS_OPERATOR_ID=1
          SOCKABUS_MESSAGE_KEY=$(openssl rand -base64 32)
          SOCKABUS_SIM=1
          SOCKABUS_LLM_PROVIDER=fake
          SOCKABUS_REPLY_DELAY_MIN=1s
          SOCKABUS_REPLY_READ_MIN=1s
          SOCKABUS_REPLY_READ_MAX=2s
          SOCKABUS_TYPING_WPM=3000
          SOCKABUS_REPLY_BUBBLE_GAP=0s
          SOCKABUS_TEMPORAL_TASK_QUEUE=sockabus-e2e
          SOCKABUS_TG_APP_ID=1
          SOCKABUS_TG_APP_HASH=ci-no-sessions
          SOCKABUS_SESSION_SECRET=$session_secret
          SOCKABUS_CONSOLE_GOOGLE_ALLOWED_EMAILS=e2e-operator@sockabus.test
          GOOGLE_CLIENT_ID=ci-not-a-real-client.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET=ci-not-a-real-secret
          EOF
          # Connector on with no session files (nothing connects); console sign-in on, as in production.
          echo "SOCKABUS_OPERATOR_TOKEN=$token" >> "$GITHUB_ENV"
          echo "SOCKABUS_SESSION_SECRET=$session_secret" >> "$GITHUB_ENV"
          echo "SOCKABUS_E2E_CONSOLE_EMAIL=e2e-operator@sockabus.test" >> "$GITHUB_ENV"
          echo "SOCKABUS_E2E_LLM=fake" >> "$GITHUB_ENV"
          echo "SOCKABUS_E2E_PSQL=docker compose exec -T postgres psql -U buru -d buru" >> "$GITHUB_ENV"

      # Schema first: with the Telegram connector on, the app reads honeypot_accounts at startup.
      - name: Start PostgreSQL, migrate and seed
        run: |
          # web bind-mounts these; on Linux Docker would create missing ones as root and Playwright
          # (runner user) could then not write its results, report or traces.
          mkdir -p playwright/results playwright/playwright-report playwright/test-results
          docker compose up -d --wait postgres
          docker compose --profile tools run --rm migrate
          docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U buru -d buru < db/seed/001_demo.sql

      - name: Start the Compose stack
        run: docker compose --profile app up -d --build --wait postgres redis temporal app web

      - name: Wait for /readyz and the console
        run: |
          for i in $(seq 1 60); do
            curl -fsS "$SOCKABUS_API_URL/readyz" && curl -fsS -o /dev/null "$SOCKABUS_WEB_URL/sign-in" && exit 0
            sleep 2
          done
          echo "stack did not become ready in 120 s" >&2
          exit 1

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: playwright/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: playwright/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: playwright
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: playwright

      # @live tests (journey a: real LLM, journey b: logged-in Telegram number) cannot run here;
      # playwright/scripts/e2e-stack.sh test and the launchd monitor still run them.
      - name: Playwright (api + ui, without @live)
        working-directory: playwright
        run: pnpm test:e2e --grep-invert @live

      - name: Save Compose logs
        if: ${{ !cancelled() }}
        run: docker compose --profile app logs --no-color > compose.log 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright/playwright-report/
            playwright/test-results/
            playwright/results/
            compose.log
          retention-days: 14

      - name: Tear down
        if: always()
        run: docker compose --profile app --profile tools down -v
